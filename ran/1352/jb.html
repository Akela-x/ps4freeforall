<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>1352 Exploit</title>
</head>
<body>
  <div id="msg" style="display:none">Restart your console</div>
  <div id="state"></div>
  <div id="out"></div>

  <script type="module">
    import "./jb.js?v=19";
  </script>

  <script>
    (function () {
      function relay(el) {
        if (!el || window.parent === window) return;
        var observer = new MutationObserver(function () {
          try {
            window.parent.postMessage(
              { type: 'status1352', msg: el.textContent || el.innerHTML, cls: '' },
              '*'
            );
          } catch (e) {}
        });
        observer.observe(el, { childList: true, subtree: true, characterData: true });
      }
      window.addEventListener('load', function () {
        // #state — краткий статус
        relay(document.getElementById('state'));

        // #out — фильтруем verbose kernel data, показываем только важные строки
        (function() {
            var outEl = document.getElementById('out');
            if (!outEl || window.parent === window) return;
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(m) {
                    m.addedNodes.forEach(function(node) {
                        if (node.nodeType !== 1) return;
                        var text = (node.textContent || '').trim();
                        if (!text) return;
                        // Пропускаем verbose kernel/exploit data
                        if (/oid=|caps=|bits24|armings=|DIRTY|SWEEP|STRAGGLER|PIN-|PR-|KF-|0x[0-9a-f]{6,}/i.test(text)) return;
                        if (text.length > 100) return;
                        try {
                            window.parent.postMessage({ type: 'status1352', msg: text, cls: '' }, '*');
                        } catch(e) {}
                    });
                });
            });
            observer.observe(outEl, { childList: true });
        })();
      });
    })();
  </script>
</body>
</html>
