<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
</head>
<body>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <pre id="console"></pre>
</div>
<script>
// Payload path for slopkit chains
if (!sessionStorage.getItem("payload_path")) {
    sessionStorage.setItem("payload_path", "../goldhen.bin");
}
</script>
<script type="module">import "./chain_poops.js";</script>
<script>
(function() {
    if (window.parent === window) return;
    var FINAL_OK  = /^ALL DONE$/i;
    var FINAL_ERR = /^FAILED -- see log$|^FREED BUT NOT RECLAIMED -- REBOOT NOW$|^REBOOT THE CONSOLE$|^REBOOT FIRST -- this kernel is still poisoned$/i;
    function sendSlopkit(msg, cls, fin) {
        var clean = (msg || '').replace(/<[^>]*>/g, '').trim();
        if (!clean) return;
        try { window.parent.postMessage({ type: 'status_slopkit', msg: clean, cls: cls || '', final: !!fin }, '*'); } catch(e) {}
    }
    var stateEl = document.getElementById('state');
    if (stateEl) {
        sendSlopkit(stateEl.textContent);
        new MutationObserver(function() {
            var t = stateEl.textContent, c = stateEl.className;
            var fin = FINAL_OK.test(t) || FINAL_ERR.test(t);
            sendSlopkit(t, c, fin);
        }).observe(stateEl, { childList: true, subtree: true, characterData: true });
    }
    var consoleEl = document.getElementById('console');
    if (consoleEl) {
        new MutationObserver(function() {
            var lines = consoleEl.querySelectorAll('span');
            var last = lines.length ? lines[lines.length - 1] : consoleEl;
            sendSlopkit(last.textContent);
        }).observe(consoleEl, { childList: true, subtree: true });
    }
})();
</script>
</body>
</html>
