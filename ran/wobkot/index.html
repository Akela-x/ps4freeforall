<!doctype html>
<html>
  <head>
    <script src="src/main.js" defer></script>
    <title>PS4 WebKit</title>
  </head>
  <body>
    <pre id="console"></pre>

    <script>
      /* Трансляция лога и финального статуса в родительский хост */
      (function () {
        var FINAL_OK  = /Kernel exploit succeeded|GoldHEN.*[Ll]oaded|GoldHEN installed|Already [Jj]ailbroken|exploit.*done|exploit.*success|bin returned 0 !!/i;
        var FINAL_ERR = /Please restart|DieError:|exploit is WIP|Unsupported console|\[-\].*[Ee]rror|bin returned [^0]/i;

        var _lastMsg = '';
        var _done = false;

        function _pm(obj) {
          try { window.parent.postMessage(obj, '*'); } catch(e) {}
          try { if (window.top !== window.parent) window.top.postMessage(obj, '*'); } catch(e) {}
        }

        window.addEventListener('load', function () {
          var el = document.getElementById('console');
          if (!el || window.parent === window) return;

          var observer = new MutationObserver(function () {
            if (_done) return;
            try {
              var lines = (el.textContent || '').split('\n').filter(function(l){ return l.trim(); });
              var last = lines[lines.length - 1] || '';
              if (last === _lastMsg) return;
              _lastMsg = last;

              var isOk  = FINAL_OK.test(last);
              var isErr = FINAL_ERR.test(last);

              var payload = { type: 'statusWobkot', msg: last, cls: '' };

              if (isOk) {
                _done = true;
                payload.final = 'ok';
                payload.cls   = 'ok';
              } else if (isErr) {
                _done = true;
                payload.final = 'err';
                payload.cls   = 'error';
              }

              _pm(payload);
            } catch(e) {}
          });

          observer.observe(el, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>
  </body>
</html>
