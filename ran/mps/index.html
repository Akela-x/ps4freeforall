<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="author" content="mansoor0x">
  <meta name="copyright" content="Copyright 2026 mansoor0x | 1_X @ZeroMan">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 14.00 · GoldHEN</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; padding: 20px; background: #fff; color: #000;
      font: 13px 'Courier New', monospace; text-align: center;
    }
    #out { max-width: 900px; margin: 0 auto; white-space: pre-wrap; word-wrap: break-word; }
    .highlight { color: #c00; font-weight: bold; }
    h1 { margin: 0 0 18px; font-size: 18px; font-weight: bold; }
    #status { margin-top: 24px; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #c00; }
  </style>
</head>
<body>
  <main id="out">
    <h1>PS4 14.00 · GoldHEN</h1>
    <p>Preparing offline exploit cache...</p>
    <p id="status"><span class="dot"></span><span class="highlight">Starting automatically</span></p>
  </main>
  <footer style="margin-top:42px;color:#777;font-size:11px">© 2026 mansoor0x · 1_X @ZeroMan</footer>
  <script>
  /* Wait for the root AppCache manifest (ps4.appcache) to finish caching
     before navigating into the exploit. The manifest lives on the host root
     and is not referenced by this page, so we cannot listen to its events
     directly. Instead we poll applicationCache on the top window (window.top)
     where the manifest is active, then call go() once it is IDLE or done.
     If we cannot reach the top window (cross-origin) or AppCache is absent,
     we fall through immediately — the files may already be cached. */
  (function () {
      var statusEl = document.getElementById("status");
      function dbg(msg) {
          try {
              statusEl.innerHTML = msg;
              window.top.postMessage({ type: 'statusMps', msg: '[mps/index] ' + msg, cls: 'info' }, '*');
          } catch(e) {}
      }

      var POLL_INTERVAL = 200;
      var MAX_WAIT_MS   = 8000;
      var started = Date.now();
      var gone = false;

      function go(reason) {
          if (gone) return;
          gone = true;
          dbg('go(): ' + reason);
          var token = "mps_launch_" + Date.now();
          var lsOk = false;
          try { localStorage.setItem("mps_launch_token", token); lsOk = true; } catch (e) {}
          dbg('localStorage ' + (lsOk ? 'OK' : 'FAIL') + ' → navigating...');
          setTimeout(function() {
              location.replace("exploit.html?log=1&afterglow=run&mode=goldhen");
          }, 300);
      }

      function acStatusName(s, ac) {
          if (s === ac.UNCACHED)   return 'UNCACHED(0)';
          if (s === ac.IDLE)       return 'IDLE(1)';
          if (s === ac.CHECKING)   return 'CHECKING(2)';
          if (s === ac.DOWNLOADING) return 'DOWNLOADING(3)';
          if (s === ac.UPDATEREADY) return 'UPDATEREADY(4)';
          if (s === ac.OBSOLETE)   return 'OBSOLETE(5)';
          return 'UNKNOWN(' + s + ')';
      }

      function tryGo() {
          if (Date.now() - started >= MAX_WAIT_MS) { go('timeout'); return; }

          var ac;
          try { ac = window.top.applicationCache; } catch (e) { go('no-top-ac: ' + e); return; }
          if (!ac) { go('ac=null'); return; }

          var s = ac.status;
          dbg('ac.status=' + acStatusName(s, ac));

          if (s === ac.UNCACHED || s === ac.IDLE || s === ac.OBSOLETE) {
              go('status=' + acStatusName(s, ac)); return;
          }
          if (s === ac.UPDATEREADY) {
              try { ac.swapCache(); } catch (e) {}
              go('updateready'); return;
          }
          setTimeout(tryGo, POLL_INTERVAL);
      }

      dbg('starting poll...');
      tryGo();
  })();
  </script>
</body>
</html>
