<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
</head>
<body>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <div id="out"></div>
</div>
<script>
/* Перехватываем ошибки */
window.addEventListener("error", function(e) {
    var msg = "chain_poops ERROR: " + (e.message || String(e));
    document.getElementById("state").textContent = msg;
});
window.addEventListener("unhandledrejection", function(e) {
    var msg = "chain_poops REJECT: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    document.getElementById("state").textContent = msg;
});
/* Загружаем цепочку динамически — статический type="module" молчит при сбое на FW 12.xx */
(function() {
    var script = document.createElement("script");
    script.type = "module";
    script.src = "chain_poops.js";
    script.onerror = function() {
        document.getElementById("state").textContent = "chain_poops: модуль не загрузился (onerror)";
    };
    document.body.appendChild(script);
})();
</script>
<script>
/* Relay: пробрасываем статус наверх к корневому диспетчеру.
   Наблюдаем за #state (короткий статус) и #out (лог mark()).
   run_poops.html открывается через location.replace внутри того же iframe,
   поэтому window.top достигает корня напрямую. */
(function () {
    var FINAL_OK  = /ALL DONE/i;
    var FINAL_ERR = /REBOOT THE CONSOLE/i;
    if (window.top === window) return;

    function send(msg, cls, fin) {
        try {
            window.top.postMessage(
                { type: "statusG2", msg: msg, cls: cls || "", final: fin || undefined }, "*"
            );
        } catch (e) {}
    }

    /* #state — короткий статус (меняется редко, сразу финальный) */
    var stateEl = document.getElementById("state");
    var lastState = "";
    if (stateEl) {
        var stateObs = new MutationObserver(function () {
            var text = stateEl.textContent || "";
            if (text === lastState) return;
            lastState = text;
            var cls = stateEl.className || "";
            var fin = FINAL_OK.test(text) || FINAL_ERR.test(text);
            send(text, cls, fin);
        });
        stateObs.observe(stateEl, { childList: true, characterData: true, subtree: true });
    }

    /* #out — лог mark(): пересылаем последнюю строку при каждом обновлении */
    var outEl = document.getElementById("out");
    if (outEl) {
        var outObs = new MutationObserver(function () {
            var spans = outEl.querySelectorAll("span");
            var last = spans.length ? spans[spans.length - 1] : null;
            var text = last ? (last.textContent || "") : (outEl.textContent || "");
            var cls  = last ? (last.className || "") : "";
            if (text) send(text, cls, false);
        });
        outObs.observe(outEl, { childList: true, subtree: true });
    }
})();
</script>
</body>
</html>
