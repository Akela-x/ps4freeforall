<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
</head>
<body>
<div id="wrap">
  <div id="state">loading lapse chain...</div>
  <div id="out"></div>
</div>
<script>
/* Расширенная диагностика */
window.addEventListener("error", function(e) {
    var msg = "JS ERROR: " + (e.message || String(e))
            + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "");
    document.getElementById("state").textContent = msg;
    var out = document.getElementById("out");
    if (out) out.textContent = msg;
});
window.addEventListener("unhandledrejection", function(e) {
    var r = e.reason;
    var msg = "REJECT: " + (r && r.message ? r.message : String(r))
            + (r && r.stack ? "\n" + r.stack : "");
    document.getElementById("state").textContent = msg.split("\n")[0];
    var out = document.getElementById("out");
    if (out) out.textContent = msg;
});
</script>
<script src="chain_poops_bundle.js"></script>
<script>
(function () {
    var FINAL_OK  = /ALL DONE/i;
    var FINAL_ERR = /REBOOT THE CONSOLE/i;
    if (window.top === window) return;
    function send(msg, cls, fin) {
        try { window.top.postMessage({ type: "statusG2", msg: msg, cls: cls || "", final: fin || undefined }, "*"); } catch(e) {}
    }
    var stateEl = document.getElementById("state");
    var lastState = "";
    if (stateEl) {
        new MutationObserver(function () {
            var text = stateEl.textContent || "";
            if (text === lastState) return;
            lastState = text;
            send(text, stateEl.className || "", FINAL_OK.test(text) || FINAL_ERR.test(text));
        }).observe(stateEl, { childList: true, characterData: true, subtree: true });
    }
    var outEl = document.getElementById("out");
    if (outEl) {
        new MutationObserver(function () {
            var spans = outEl.querySelectorAll("span");
            var last = spans.length ? spans[spans.length - 1] : null;
            var text = last ? (last.textContent || "") : (outEl.textContent || "");
            var cls  = last ? (last.className || "") : "";
            if (text) send(text, cls, false);
        }).observe(outEl, { childList: true, subtree: true });
    }
})();
</script>
</body>
</html>
