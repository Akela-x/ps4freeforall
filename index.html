<!DOCTYPE html>
<html manifest="ps4.appcache">
<head>
    <meta charset="utf-8">
    <title>PS4 WEBKIT — Загрузка</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── CSS-переменные (литеральные значения — PS4 WebKit не поддерживает var()) ── */
        /* Все цвета продублированы напрямую в правилах ниже */

        /* ── Зона анимации ──────────────────────────────────────────────────── */
        #anim-zone {
            width: 100%;
            padding: 8px 0 4px;
        }

        /* ── Анимация Б — Горизонтальный сканер ─────────────────────────────── */
        .zb {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: stretch;
            align-items: stretch;
            gap: 8px;
            width: 100%;
        }
        .sc-hdr {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
        }
        .sc-lbl {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: #4f9cff;
            text-transform: uppercase;
            min-height: 1.2em;
            display: block;
        }
        .sc-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #4f9cff;
            -webkit-animation: dotB 1s ease-in-out infinite;
            animation: dotB 1s ease-in-out infinite;
        }
        .sc-track {
            position: relative; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px; overflow: hidden;
        }
        .sc-beam {
            position: absolute; top:0; left:-40%; width:40%; height:100%;
            background: -webkit-linear-gradient(left, transparent, #4f9cff, rgba(79,156,255,0.3), transparent);
            background: linear-gradient(90deg, transparent, #4f9cff, rgba(79,156,255,0.3), transparent);
            -webkit-animation: scanM 1.4s ease-in-out infinite;
            animation: scanM 1.4s ease-in-out infinite;
        }
        .sc-segs {
            display: -webkit-flex;
            display: flex;
            gap: 2px; height: 30px;
            -webkit-align-items: flex-end;
            align-items: flex-end;
        }
        .sc-seg {
            -webkit-flex: 1;
            flex: 1; border-radius: 2px 2px 0 0;
            background: rgba(79,156,255,0.12);
            border: 1px solid rgba(79,156,255,0.15);
            -webkit-transition: height 0.2s ease;
            transition: height 0.2s ease; min-height: 3px;
        }
        .sc-info {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            min-height: 1.2em;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem; color: #9296a4; letter-spacing: 1px;
        }
        .sc-status {
            font-family: 'Orbitron', sans-serif;
            min-height: 1.3em;
            font-size: 0.68rem; letter-spacing: 3px;
            color: #4f9cff; text-align: center;
            -webkit-animation: scBlink 2s ease-in-out infinite;
            animation: scBlink 2s ease-in-out infinite;
        }

        /* Состояние: успех (ss) */
        .zb.ss .sc-dot    { background: #51cf66; -webkit-animation: none; animation: none; }
        .zb.ss .sc-beam   {
            background: -webkit-linear-gradient(left, transparent, #51cf66, rgba(81,207,102,0.3), transparent);
            background: linear-gradient(90deg, transparent, #51cf66, rgba(81,207,102,0.3), transparent);
            -webkit-animation: none; animation: none; width:100%; left:0;
        }
        .zb.ss .sc-track  { background: rgba(81,207,102,0.12); }
        .zb.ss .sc-seg    { border-color: rgba(81,207,102,0.3); background: rgba(81,207,102,0.2); }
        .zb.ss .sc-status { color: #51cf66; -webkit-animation: none; animation: none; }
        .zb.ss .sc-lbl    { color: #51cf66; }

        /* Состояние: ошибка (ff) */
        .zb.ff .sc-dot    { background: #ff6b6b; -webkit-animation: dotB 0.3s infinite; animation: dotB 0.3s infinite; }
        .zb.ff .sc-beam   {
            background: -webkit-linear-gradient(left, transparent, #ff6b6b, rgba(255,107,107,0.3), transparent);
            background: linear-gradient(90deg, transparent, #ff6b6b, rgba(255,107,107,0.3), transparent);
            -webkit-animation: scanM 0.3s linear infinite; animation: scanM 0.3s linear infinite;
        }
        .zb.ff .sc-seg    { border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.12); }
        .zb.ff .sc-status { color: #ff6b6b; -webkit-animation: none; animation: none; }
        .zb.ff .sc-lbl    { color: #ff6b6b; }

        /* ── Keyframes ──────────────────────────────────────────────────────── */
        @-webkit-keyframes scanM  { 0%{ left:-40%; } 100%{ left:100%; } }
        @keyframes scanM          { 0%{ left:-40%; } 100%{ left:100%; } }
        @-webkit-keyframes dotB   { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }
        @keyframes dotB           { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }
        @-webkit-keyframes scBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
        @keyframes scBlink        { 0%,100%{ opacity:1; } 50%{ opacity:.35; } }


        /* ── Прогресс-бар кэша ──────────────────────────────────────────────── */
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #4f9cff;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .progress-bar-wrap {
            width: 100%;
            height: 28px;
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            border: 1px solid rgba(180,185,205,0.15);
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: -webkit-linear-gradient(left, #2a4a7f, #4f7fc0);
            background: linear-gradient(90deg, #2a4a7f, #4f7fc0);
            border-radius: 14px;
            -webkit-transition: width 0.3s ease;
            transition: width 0.3s ease;
        }
        .progress-bar-fill.done {
            background: -webkit-linear-gradient(left, #1a6b3a, #51cf66);
            background: linear-gradient(90deg, #1a6b3a, #51cf66);
        }
        .progress-bar-label {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
        }
        .progress-bar-label.in-progress { color: #c8deff; }
        .progress-bar-label.complete    { color: #0a2a14; }
        .loading-progress.error {
            font-size: 13px;
            color: #ff6b6b;
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
            margin-top: 8px;
        }

        /* ── Лог-контейнер ──────────────────────────────────────────────────── */
        .log-container {
            display: none;
            -webkit-flex: 1;
            flex: 1;
            min-height: 0;
            height: 185px;
            background: rgba(18,20,31,0.65);
            border: 1px solid rgba(180,185,205,0.16);
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 14px 16px 10px;
            margin: 8px 0;
            font-family: Consolas, "Liberation Mono", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #b8c8e0;
            text-align: left;
        }
        .log-container .log-line { padding: 1px 0; word-break: break-all; text-align: left; }
        .log-container .log-line.error   { color: #ff6b6b; }
        .log-container .log-line.success { color: #51cf66; }
        .log-container .log-line.info    { color: #74c0fc; }
        .log-container::-webkit-scrollbar       { width: 5px; }
        .log-container::-webkit-scrollbar-track { background: #1a1d23; }
        .log-container::-webkit-scrollbar-thumb { background: #3a3d45; border-radius: 3px; }
    </style>
</head>
<body class="landing-page">

    <!-- ════════════════════════════════════════════════════════════════════
         ГЛАВНЫЙ ВИД
         ════════════════════════════════════════════════════════════════════ -->
    <div id="main-view">
        <div class="title-container">
            <h1 class="main-title">
                <span class="name-mustafa">PS4 WEBKIT</span>
            </h1>
        </div>

        <hr class="separator">

        <!-- Анимация Б — Горизонтальный сканер -->
        <div id="anim-zone">
            <div class="zb" id="zbAnim" style="width:100%;">
                <div class="sc-hdr">
                    <div class="sc-lbl" id="scLbl">ИНИЦИАЛИЗАЦИЯ</div>
                    <div class="sc-dot" id="scDot"></div>
                </div>
                <div class="sc-track"><div class="sc-beam" id="scBeam"></div></div>
                <div class="sc-segs" id="scSegs"></div>
                <div class="sc-info">
                    <span id="scInfoL"></span>
                    <span id="scInfoR"></span>
                </div>
                <div class="sc-status" id="scStatus">ОЖИДАНИЕ...</div>
            </div>
        </div>

        <!-- Фаза 1: установка кэша -->
        <div id="phase-cache" style="margin-top: 40px;">
            <p class="loading-text" id="loading-text">Загрузка...</p>
            <div class="progress-bar-wrap" id="progress-bar-wrap" style="display:none;">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
                <div class="progress-bar-label in-progress" id="progress-bar-label">0%</div>
            </div>
            <p class="loading-progress error" id="loading-progress" style="display:none;"></p>
        </div>

        <!-- Фаза 2: лог эксплойта -->
        <div class="log-container" id="log-container">
            <div id="log-output"></div>
        </div>

        <h1 id="footer-credits" style="font-size: 13px; color: #555967; text-align: center; margin: 8px 0 4px; padding: 0;">
            Специально для 4PDA Sony PlayStation 4 - Взлом<br>
            Особая благодарность всем разработчикам сцены
        </h1>
    </div><!-- /#main-view -->

    <script>
    // ════════════════════════════════════════════════════════════════════════
    //  ОПРЕДЕЛЕНИЕ ПРОШИВКИ
    // ════════════════════════════════════════════════════════════════════════
    var _uaFull   = navigator.userAgent;
    var _uaMatch  = _uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var _isPS4    = _uaMatch !== null;
    var _fwGlobal = _isPS4 ? _uaMatch[1] : null;

    // Показать версию прошивки справа в sc-info (постоянно)
    (function() {
        var el = document.getElementById('scInfoR');
        if (el) el.textContent = _fwGlobal ? 'FW ' + _fwGlobal : '';
    })();

    // ════════════════════════════════════════════════════════════════════════
    //  АНИМАЦИЯ Б — Горизонтальный сканер (инициализация сегментов)
    // ════════════════════════════════════════════════════════════════════════
    (function() {
        var c = document.getElementById('scSegs');
        for (var i = 0; i < 24; i++) {
            var d = document.createElement('div');
            d.className = 'sc-seg'; d.id = 'asg' + i;
            c.appendChild(d);
        }
    })();

    var _segTimer = null;
    function animSegsStart() {
        if (_segTimer) clearInterval(_segTimer);
        _segTimer = setInterval(function() {
            for (var i = 0; i < 24; i++) {
                var h = Math.floor(Math.random() * 26) + 3;
                var el = document.getElementById('asg' + i);
                if (el) el.style.height = h + 'px';
            }
        }, 130);
    }
    function animSegsStop(fillFull) {
        if (_segTimer) { clearInterval(_segTimer); _segTimer = null; }
        for (var i = 0; i < 24; i++) {
            var el = document.getElementById('asg' + i);
            if (el) el.style.height = (fillFull ? '30px' : '3px');
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  setAnimState — управление состоянием анимации Б
    //  Состояния: 'cache' | 'run' | 'ok' | 'err'
    // ════════════════════════════════════════════════════════════════════════
    function setAnimState(state, fwStr) {
        var w = document.getElementById('zbAnim');

        if (state === 'cache') {
            w.className = 'zb';
            document.getElementById('scLbl').textContent    = 'ЗАГРУЗКА КЭША';
            document.getElementById('scStatus').textContent = 'УСТАНОВКА...';
            document.getElementById('scInfoL').textContent  = 'APPCACHE';
            animSegsStart();
        } else if (state === 'run') {
            w.className = 'zb';
            document.getElementById('scLbl').textContent    = 'SCANNING KERNEL';
            document.getElementById('scStatus').textContent = 'ОБХОД ЗАЩИТЫ...';
            document.getElementById('scInfoL').textContent  = 'ROP CHAIN';
            animSegsStart();
        } else if (state === 'ok') {
            w.className = 'zb ss';
            document.getElementById('scLbl').textContent    = 'KERNEL PATCHED';
            document.getElementById('scStatus').textContent = 'СИСТЕМА ВЗЛОМАНА';
            document.getElementById('scInfoL').textContent  = 'GOLDHEN ACTIVE';
            animSegsStop(true);
        } else if (state === 'err') {
            w.className = 'zb ff';
            document.getElementById('scLbl').textContent    = 'EXPLOIT FAILED';
            document.getElementById('scStatus').textContent = 'ОШИБКА — ПЕРЕЗАПУСТИТЕ КОНСОЛЬ';
            document.getElementById('scInfoL').textContent  = 'CHAIN ABORTED';
            animSegsStop(false);
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  УТИЛИТЫ ЛОГА
    // ════════════════════════════════════════════════════════════════════════
    var lastMsg = "";
    var exploitLaunched = false;

    function switchToLog() {
        document.getElementById('phase-cache').style.display = 'none';
        document.getElementById('log-container').style.display = 'flex';
        document.getElementById('log-container').style.webkitFlexDirection = 'column';
        document.getElementById('log-container').style.flexDirection = 'column';
    }
    function appendLog(msg, cls) {
        if (!msg || !msg.trim()) return;
        if (msg === lastMsg) return;
        lastMsg = msg;
        var output = document.getElementById('log-output');
        var container = document.getElementById('log-container');
        var line = document.createElement('div');
        line.className = 'log-line' + (cls ? ' ' + cls : '');
        line.innerHTML = msg;
        output.appendChild(line);
        container.scrollTop = container.scrollHeight;
    }

    // ════════════════════════════════════════════════════════════════════════
    //  ЗАПУСК ЭКСПЛОЙТА
    // ════════════════════════════════════════════════════════════════════════
    function launchExploit() {
        if (exploitLaunched) return;
        exploitLaunched = true;
        switchToLog();

        var isPS4 = _isPS4;
        var fwVersion = _fwGlobal || "Unknown";
        var fwNum = parseFloat(fwVersion);

        function addFrame(src, msgType) {
            appendLog('Запуск эксплойта для FW ' + fwVersion + "...", "info");
            setAnimState('run', fwVersion);
            var fr = document.createElement('iframe');
            fr.src = src;
            fr.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";
            document.body.appendChild(fr);
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === msgType) {
                    var msg = e.data.msg || '';
                    var cls = e.data.cls || '';
                    appendLog(msg, cls);
                    if (e.data.final) {
                        if (/ALL DONE|\bDONE\b|Kernel exploit succeeded|PSFree.*exploit.*AIO|AIO fixes applied|GoldHEN.*Loaded|Already [Jj]ailbroken|GoldHEN is Already Loaded|already open|PROOF-SUMMARY-FINAL[^|]*fail=0/i.test(msg)) {
                            setAnimState('ok');
                        } else {
                            setAnimState('err');
                        }
                    }
                }
            });
        }

        if (!isPS4) {
            appendLog('Только для PS4 с поддерживаемой прошивкой 5.05–14.00', "error");
        } else if (fwNum >= 5.05 && fwNum <= 5.07) {
            addFrame("ran/g2allpro/index.html", "statusG2");
        } else if (fwNum >= 6.00 && fwNum < 6.72) {
            addFrame("ran/psfree/index.html", "statusPSFree");
        } else if (fwNum === 6.72) {
            addFrame("ran/672/index.html", "status672");
        } else if (fwNum >= 7.00 && fwNum <= 9.60) {
            addFrame("ran/psfree/index.html", "statusPSFree");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            addFrame("ran/g2allpro/index.html", "statusG2");
        } else if (fwNum > 11.02 && fwNum <= 13.00) {
            addFrame("ran/slopkit/index.html", "status_slopkit");
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            addFrame("ran/1352/jb.html?log=1", "status1352");
        } else if (fwNum === 14.00) {
            addFrame("ran/mps/index.html", "statusMps");
        } else {
            appendLog('Неподдерживаемая прошивка: ' + fwVersion, "error");
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  ИНИЦИАЛИЗАЦИЯ — управление AppCache
    // ════════════════════════════════════════════════════════════════════════
    (function init() {
        // Запустить анимацию в режиме ожидания
        animSegsStart();

        var status_el   = document.getElementById('loading-text');
        var progress_el = document.getElementById('loading-progress');
        var bar_wrap    = document.getElementById('progress-bar-wrap');
        var bar_fill    = document.getElementById('progress-bar-fill');
        var bar_label   = document.getElementById('progress-bar-label');
        var cache = window.applicationCache;

        function setProgress(pct) {
            bar_wrap.style.display = 'block';
            bar_fill.style.width = pct + '%';
            bar_label.textContent = pct + '%';
            if (pct >= 100) {
                bar_fill.className = 'progress-bar-fill done';
                bar_label.className = 'progress-bar-label complete';
            } else {
                bar_fill.className = 'progress-bar-fill';
                bar_label.className = 'progress-bar-label in-progress';
            }
        }

        if (!cache || cache.status === cache.UNCACHED) {
            status_el.textContent = 'Установка кэша...';
            setAnimState('cache');
        } else if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
            launchExploit();
        } else {
            status_el.textContent = 'Загрузка...';
            setAnimState('cache');
        }

        cache.addEventListener('progress', function(e) {
            setAnimState('cache');
            if (e.lengthComputable && e.total > 0) {
                var pct = Math.round(e.loaded / e.total * 100);
                setProgress(pct);
            } else {
                setProgress(Math.min(99, (e.loaded || 1) * 10));
            }
        });

        cache.addEventListener('cached', function() {
            setProgress(100);
            setTimeout(function() {
                switchToLog();
                appendLog('Кэш установлен и проверен', "success");
                appendLog('Отключите интернет и перезапустите консоль — хост готов к офлайн-работе', "info");
            }, 1500);
        });

        cache.addEventListener('noupdate', function() {
            launchExploit();
        });

        cache.addEventListener('updateready', function() {
            cache.swapCache();
            launchExploit();
        });

        cache.addEventListener('error', function() {
            if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
                launchExploit();
            } else if (!exploitLaunched) {
                status_el.textContent = 'Ошибка кэша';
                bar_wrap.style.display = 'none';
                progress_el.style.display = 'block';
                progress_el.textContent = 'Очистите данные браузера и перезапустите консоль';
                setAnimState('err');
            }
        });
    })();
    </script>
</body>
</html>
