<!DOCTYPE html>
<html manifest="ps4.appcache">
<head>
    <meta charset="utf-8">
    <title>PS4 WEBKIT — Загрузка</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── CSS-переменные ─────────────────────────────────────────────────── */
        :root {
            --blue:       #4f9cff;
            --blue-glow:  rgba(79,156,255,0.28);
            --green:      #51cf66;
            --green-glow: rgba(81,207,102,0.30);
            --red:        #ff6b6b;
            --red-glow:   rgba(255,107,107,0.28);
            --fg-muted:   #9296a4;
        }

        /* ── Кнопка шестерёнки ──────────────────────────────────────────────── */
        #settings-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: rgba(79,156,255,0.08);
            color: #4f9cff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 100;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            padding: 0;
            line-height: 1;
        }
        #settings-btn:hover,
        #settings-btn:active {
            background: rgba(79,156,255,0.20);
            transform: rotate(30deg);
        }

        /* ── Зона анимации ──────────────────────────────────────────────────── */
        #anim-zone {
            width: 100%;
            padding: 8px 0 4px;
        }

        /* ── Анимация Б — Горизонтальный сканер ─────────────────────────────── */
        .zb {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            width: 100%;
        }
        .sc-hdr { display: flex; align-items: center; justify-content: space-between; }
        .sc-lbl {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--blue);
            text-transform: uppercase;
            min-height: 1.2em;
            display: block;
        }
        .sc-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--blue);
            box-shadow: 0 0 6px var(--blue-glow);
            animation: dotB 1s ease-in-out infinite;
        }
        .sc-track {
            position: relative; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px; overflow: hidden;
        }
        .sc-beam {
            position: absolute; top:0; left:-40%; width:40%; height:100%;
            background: linear-gradient(90deg, transparent, var(--blue), rgba(79,156,255,0.3), transparent);
            animation: scanM 1.4s ease-in-out infinite;
        }
        .sc-segs { display: flex; gap: 2px; height: 30px; align-items: flex-end; }
        .sc-seg  {
            flex: 1; border-radius: 2px 2px 0 0;
            background: rgba(79,156,255,0.12);
            border: 1px solid rgba(79,156,255,0.15);
            transition: height 0.2s ease; min-height: 3px;
        }
        .sc-info {
            display: flex; justify-content: space-between; min-height: 1.2em;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem; color: var(--fg-muted); letter-spacing: 1px;
        }
        .sc-status {
            font-family: 'Orbitron', sans-serif;
            min-height: 1.3em;
            font-size: 0.68rem; letter-spacing: 3px;
            color: var(--blue); text-align: center;
            animation: scBlink 2s ease-in-out infinite;
        }
        .zb.ss .sc-dot    { background: var(--green); box-shadow: 0 0 6px var(--green-glow); animation: none; }
        .zb.ss .sc-beam   { background: linear-gradient(90deg,transparent,var(--green),rgba(81,207,102,0.3),transparent); animation: none; width:100%; left:0; }
        .zb.ss .sc-track  { background: rgba(81,207,102,0.12); }
        .zb.ss .sc-seg    { border-color: rgba(81,207,102,0.3); background: rgba(81,207,102,0.2); }
        .zb.ss .sc-status { color: var(--green); animation: none; }
        .zb.ss .sc-lbl    { color: var(--green); }
        .zb.ff .sc-dot    { background: var(--red); box-shadow: 0 0 6px var(--red-glow); animation: dotB 0.3s infinite; }
        .zb.ff .sc-beam   { background: linear-gradient(90deg,transparent,var(--red),rgba(255,107,107,0.3),transparent); animation: scanM 0.3s linear infinite; }
        .zb.ff .sc-seg    { border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.12); }
        .zb.ff .sc-status { color: var(--red); animation: none; }
        .zb.ff .sc-lbl    { color: var(--red); }

        /* ── Анимация А — Пульсирующие кольца ──────────────────────────────── */
        .za { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .ring-wrap { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
        .ro { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--blue); border-right-color: var(--blue); animation: spA 1.2s linear infinite; opacity: 0.75; }
        .rm { position: absolute; width: 66px; height: 66px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: rgba(79,156,255,0.5); border-left-color: rgba(79,156,255,0.5); animation: spB 1.8s linear infinite; }
        .rp { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--blue); animation: pOut 2s ease-out infinite; opacity: 0; }
        .rc { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle, rgba(79,156,255,0.25) 0%, rgba(30,32,45,0.6) 70%); border: 1px solid rgba(79,156,255,0.3); display: flex; align-items: center; justify-content: center; animation: cPulse 2s ease-in-out infinite; position: relative; z-index: 1; }
        .rc::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue-glow), 0 0 16px var(--blue-glow); display: block; }
        .za.ss .rc::after { background: var(--green); box-shadow: 0 0 8px var(--green-glow), 0 0 16px var(--green-glow); }
        .za.ff .rc::after { background: var(--red); box-shadow: 0 0 8px var(--red-glow), 0 0 16px var(--red-glow); }
        .za-st { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 4px; color: var(--blue); text-transform: uppercase; animation: blink 1.8s ease-in-out infinite; min-height: 1.2em; display: block; }
        .za-sub { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; color: var(--fg-muted); letter-spacing: 2px; display: block; }
        .za.ss .ro { border-top-color: var(--green); border-right-color: var(--green); animation: none; }
        .za.ss .rm { animation: none; border-top-color: rgba(81,207,102,0.5); border-left-color: rgba(81,207,102,0.5); }
        .za.ss .rc { background: radial-gradient(circle, rgba(81,207,102,0.2) 0%, rgba(30,32,45,0.6) 70%); border-color: rgba(81,207,102,0.4); box-shadow: 0 0 16px var(--green-glow), 0 0 32px var(--green-glow); animation: none; }
        .za.ss .rp { border-color: var(--green); }
        .za.ss .za-st { color: var(--green); animation: none; }
        .za.ss .za-sub { color: var(--green); }
        .za.ff .ro { border-top-color: var(--red); border-right-color: var(--red); animation: spA 0.35s linear infinite; }
        .za.ff .rm { border-top-color: rgba(255,107,107,0.5); border-left-color: rgba(255,107,107,0.5); }
        .za.ff .rc { background: radial-gradient(circle, rgba(255,107,107,0.15) 0%, rgba(30,32,45,0.6) 70%); border-color: rgba(255,107,107,0.4); animation: shk 0.4s ease-in-out 3; }
        .za.ff .rp { border-color: var(--red); }
        .za.ff .za-st { color: var(--red); animation: none; }
        .za.ff .za-sub { color: var(--red); }

        /* ── Анимация В — Гексагональная сетка ──────────────────────────────── */
        .zc { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .hex-grid { display: flex; flex-direction: column; gap: 2px; align-items: center; }
        .hex-row { display: flex; gap: 2px; }
        .hex { width: 18px; height: 21px; background: rgba(79,156,255,0.07); border: 1px solid rgba(79,156,255,0.15); clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
        .hex.act { background: rgba(79,156,255,0.35); border-color: rgba(79,156,255,0.7); box-shadow: 0 0 6px var(--blue-glow); }
        .hex.core { background: rgba(79,156,255,0.55); border-color: var(--blue); box-shadow: 0 0 10px var(--blue-glow), 0 0 20px var(--blue-glow); }
        .zc-st { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; letter-spacing: 4px; color: var(--blue); text-transform: uppercase; animation: blink 2s ease-in-out infinite; min-height: 1.2em; display: block; }
        .zc-sub { font-family: 'Rajdhani', sans-serif; font-size: 0.78rem; color: var(--fg-muted); letter-spacing: 2px; text-align: center; display: block; }
        .zc.ss .hex.act { background: rgba(81,207,102,0.3); border-color: rgba(81,207,102,0.6); box-shadow: 0 0 6px var(--green-glow); }
        .zc.ss .hex.core { background: rgba(81,207,102,0.6); border-color: var(--green); box-shadow: 0 0 12px var(--green-glow), 0 0 24px var(--green-glow); }
        .zc.ss .zc-st { color: var(--green); animation: none; }
        .zc.ss .zc-sub { color: var(--green); }
        .zc.ff .hex.act { background: rgba(255,107,107,0.25); border-color: rgba(255,107,107,0.5); box-shadow: 0 0 6px var(--red-glow); }
        .zc.ff .hex.core { background: rgba(255,107,107,0.5); border-color: var(--red); box-shadow: 0 0 12px var(--red-glow), 0 0 24px var(--red-glow); animation: shk 0.5s ease-in-out 3; }
        .zc.ff .zc-st { color: var(--red); animation: none; }
        .zc.ff .zc-sub { color: var(--red); }

        /* ── Общие @keyframes ────────────────────────────────────────────────── */
        @keyframes scanM  { 0%{ left:-40%; } 100%{ left:100%; } }
        @keyframes dotB   { 0%,100%{ opacity:1; } 50%{ opacity:.2; } }
        @keyframes scBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
        @keyframes spA    { to { transform: rotate(360deg); } }
        @keyframes spB    { to { transform: rotate(-360deg); } }
        @keyframes cPulse { 0%,100%{ box-shadow: 0 0 6px var(--blue-glow); } 50%{ box-shadow: 0 0 18px var(--blue-glow), 0 0 36px var(--blue-glow); } }
        @keyframes pOut   { 0%{ transform:scale(1); opacity:.6; } 100%{ transform:scale(2.2); opacity:0; } }
        @keyframes blink  { 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
        @keyframes shk    { 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }

        /* ── Прогресс-бар кэша ──────────────────────────────────────────────── */
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #4f9cff;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .progress-bar-wrap {
            width: 100%;
            height: 28px;
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            border: 1px solid rgba(180,185,205,0.15);
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2a4a7f, #4f7fc0);
            border-radius: 14px;
            transition: width 0.3s ease;
        }
        .progress-bar-fill.done {
            background: linear-gradient(90deg, #1a6b3a, #51cf66);
        }
        .progress-bar-label {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
        }
        .progress-bar-label.in-progress { color: #c8deff; }
        .progress-bar-label.complete    { color: #0a2a14; }
        .loading-progress.error {
            font-size: 13px;
            color: #ff6b6b;
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
            margin-top: 8px;
        }

        /* ── Лог-контейнер ──────────────────────────────────────────────────── */
        .log-container {
            display: none;
            flex: 1;
            min-height: 0;
            height: 185px;
            background: rgba(18,20,31,0.65);
            border: 1px solid rgba(180,185,205,0.16);
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 14px 16px 0;
            margin: 8px 0;
            font-family: Consolas, "Liberation Mono", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #b8c8e0;
            text-align: left;
        }
        .log-container .log-line { padding: 1px 0; word-break: break-all; text-align: left; }
        .log-container .log-line.error   { color: #ff6b6b; }
        .log-container .log-line.success { color: #51cf66; }
        .log-container .log-line.info    { color: #74c0fc; }
        .log-container::-webkit-scrollbar       { width: 5px; }
        .log-container::-webkit-scrollbar-track { background: #1a1d23; }
        .log-container::-webkit-scrollbar-thumb { background: #3a3d45; border-radius: 3px; }

        /* ══════════════════════════════════════════════════════════════════════
           НАСТРОЙКИ — вид (#settings-view)
           ══════════════════════════════════════════════════════════════════════ */
        #main-view     { display: block; }
        #settings-view { display: none; }

        /* Контейнер настроек */
        .sv-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 8px 0 0;
        }

        /* Заголовок настроек */
        .sv-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: 5px;
            color: var(--blue);
            text-align: center;
            text-transform: uppercase;
            margin: 0 0 14px;
            padding-top: 4px;
        }

        /* Подзаголовок секции */
        .sv-section-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 10px;
            line-height: 1.2;
            letter-spacing: 3px;
            color: var(--fg-muted);
            text-transform: uppercase;
            margin: 0 0 6px;
        }

        /* Языковые карточки */
        .sv-lang-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .sv-lang-card {
            flex: 1;
            border: 1px solid rgba(79,156,255,0.18);
            border-radius: 10px;
            background: rgba(79,156,255,0.04);
            padding: 8px 6px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .sv-lang-card:hover {
            border-color: rgba(79,156,255,0.40);
            background: rgba(79,156,255,0.09);
        }
        .sv-lang-card.selected {
            border-color: var(--blue);
            background: rgba(79,156,255,0.14);
            box-shadow: 0 0 8px var(--blue-glow);
        }
        .sv-radio-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(79,156,255,0.35);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.18s;
        }
        .sv-radio-dot::after {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--blue);
            opacity: 0;
            transition: opacity 0.18s;
        }
        .sv-lang-card.selected .sv-radio-dot {
            border-color: var(--blue);
        }
        .sv-lang-card.selected .sv-radio-dot::after {
            opacity: 1;
        }
        .sv-lang-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: 2px;
            color: #c8d8f0;
        }
        .sv-lang-card.selected .sv-lang-name {
            color: var(--blue);
        }

        /* Карточки анимаций */
        .sv-anim-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .sv-anim-card {
            flex: 1;
            border: 1px solid rgba(79,156,255,0.18);
            border-radius: 10px;
            background: rgba(79,156,255,0.04);
            padding: 9px 6px 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            -webkit-tap-highlight-color: transparent;
        }
        .sv-anim-card:hover {
            border-color: rgba(79,156,255,0.40);
            background: rgba(79,156,255,0.09);
        }
        .sv-anim-card.selected {
            border-color: var(--blue);
            background: rgba(79,156,255,0.14);
            box-shadow: 0 0 8px var(--blue-glow);
        }
        .sv-anim-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(7px, 2vw, 10px);
            letter-spacing: 0.5px;
            color: var(--fg-muted);
            text-align: center;
            text-transform: uppercase;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .sv-anim-card.selected .sv-anim-label {
            color: #a8c8ff;
        }
        .sv-anim-radio {
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 1.5px solid rgba(79,156,255,0.35);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.18s;
        }
        .sv-anim-radio::after {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--blue);
            opacity: 0;
            transition: opacity 0.18s;
        }
        .sv-anim-card.selected .sv-anim-radio {
            border-color: var(--blue);
        }
        .sv-anim-card.selected .sv-anim-radio::after {
            opacity: 1;
        }

        /* Фокус карточек (D-pad навигация) */
        .sv-lang-card:focus,
        .sv-anim-card:focus {
            outline: none;
            border-color: rgba(79,156,255,0.70);
            background: rgba(79,156,255,0.11);
            box-shadow: 0 0 0 2px rgba(79,156,255,0.30);
        }
        .sv-lang-card.selected:focus,
        .sv-anim-card.selected:focus {
            box-shadow: 0 0 8px var(--blue-glow), 0 0 0 2px rgba(79,156,255,0.45);
        }

        /* Кнопки действий */
        .sv-action-row {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 8px;
        }
        .sv-btn {
            flex: 1;
            padding: 10px 6px;
            border-radius: 22px;
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            line-height: 1.2;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.18s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .sv-btn-back {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--fg-muted);
        }
        .sv-btn-back:hover,
        .sv-btn-back:active {
            background: rgba(255,255,255,0.09);
            color: #c8d0e0;
        }
        .sv-btn-apply {
            background: rgba(79,156,255,0.12);
            border: 1px solid rgba(79,156,255,0.35);
            color: var(--blue);
        }
        .sv-btn-apply:hover,
        .sv-btn-apply:active {
            background: rgba(79,156,255,0.22);
            box-shadow: 0 0 10px var(--blue-glow);
        }

        /* ── Превью анимации в настройках ──────────────────────────────────── */
        .sv-preview {
            width: 100%;
            height: 72px;
            border-radius: 10px;
            border: 1px solid rgba(79,156,255,0.15);
            background: rgba(10,12,22,0.70);
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Превью А — пульсирующие кольца (чистый CSS) */
        .pv-a { display: none; }
        .pv-a.active { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .pv-a .pr { position: absolute; border-radius: 50%; border: 1.5px solid transparent; border-top-color: #4f9cff; border-right-color: #4f9cff; }
        .pv-a .pr1 { width: 48px; height: 48px; animation: spA 1.2s linear infinite; opacity: 0.8; }
        .pv-a .pr2 { width: 34px; height: 34px; border-top-color: rgba(79,156,255,0.5); border-left-color: rgba(79,156,255,0.5); animation: spB 1.8s linear infinite; }
        .pv-a .pr3 { width: 20px; height: 20px; border-top-color: rgba(79,156,255,0.3); animation: spA 0.9s linear infinite reverse; }
        .pv-a .pr-dot { width: 6px; height: 6px; border-radius: 50%; background: #4f9cff; box-shadow: 0 0 8px #4f9cff; }
        /* Превью Б — горизонтальный сканер */
        .pv-b { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 4px; padding: 0 12px; box-sizing: border-box; }
        .pv-b.active { display: flex; }
        .pv-b-track { width: 100%; height: 3px; background: rgba(79,156,255,0.12); border-radius: 2px; overflow: hidden; position: relative; }
        .pv-b-beam  { position: absolute; top: 0; left: -30%; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, #4f9cff, transparent); animation: pvBeam 1.4s linear infinite; }
        @keyframes pvBeam { 0%{left:-30%} 100%{left:110%} }
        .pv-b-segs { display: flex; gap: 2px; }

            if (state === 'run') {

                document.getElementById('scStatus').textContent = L.animRunStatus;
                document.getElementById('scInfoL').textContent  = L.animRunInfo;
            } else if (state === 'ok') {
                document.getElementById('scLbl').textContent    = '';
                document.getElementById('scStatus').textContent = L.animOkStatus;
                document.getElementById('scInfoL').textContent  = '';
            } else if (state === 'err') {
                document.getElementById('scLbl').textContent    = L.animErrLbl;
                document.getElementById('scStatus').textContent = L.animErrStatus;
                document.getElementById('scInfoL').textContent  = L.animErrInfo;
            } else if (state === 'cache') {
                document.getElementById('scLbl').textContent    = L.animCacheLbl;
                document.getElementById('scStatus').textContent = L.animCacheStatus;
                document.getElementById('scInfoL').textContent  = L.animCacheInfo;
            }
        } else if (anim === 'a') {
            if (state === 'run') {
                document.getElementById('zaStMain').textContent  = L.zaRunSt;
                document.getElementById('zaSubMain').textContent = L.zaRunSub;
            } else if (state === 'ok') {
                document.getElementById('zaStMain').textContent  = L.zaOkSt;
                document.getElementById('zaSubMain').textContent = L.zaOkSub;
            } else if (state === 'err') {
                document.getElementById('zaStMain').textContent  = L.zaErrSt;
                document.getElementById('zaSubMain').textContent = L.zaErrSub;
            } else if (state === 'cache') {
                document.getElementById('zaStMain').textContent  = L.zaCacheSt;
                document.getElementById('zaSubMain').textContent = L.zaCacheSub;
            }
        } else if (anim === 'c') {
            if (state === 'run') {
                document.getElementById('zcStMain').textContent  = L.zcRunSt;
                document.getElementById('zcSubMain').textContent = L.zcRunSub;
            } else if (state === 'ok') {
                document.getElementById('zcStMain').textContent  = L.zcOkSt;
                document.getElementById('zcSubMain').textContent = L.zcOkSub;
            } else if (state === 'err') {
                document.getElementById('zcStMain').textContent  = L.zcErrSt;
                document.getElementById('zcSubMain').textContent = L.zcErrSub;
            } else if (state === 'cache') {
                document.getElementById('zcStMain').textContent  = L.zcCacheSt;
                document.getElementById('zcSubMain').textContent = L.zcCacheSub;
            }
        }
    }

    function setAnimState(state, fwStr) {
        _lastAnimState = state;
        if (fwStr !== undefined) _lastAnimFw = fwStr;
        var L = s();
        var anim = _curAnim;

        // Остановить все активные анимации перед переключением
        animSegsStop(false);
        hexAnimStop(false);

        showAnimBlock(anim);

        if (anim === 'b') {
            // ── Анимация Б ────────────────────────────────────────────────
            var w = document.getElementById('zbAnim');
            if (state === 'run') {
                w.className = 'zb';
                document.getElementById('scLbl').textContent    = L.animRunLbl;
                document.getElementById('scStatus').textContent = L.animRunStatus;
                document.getElementById('scInfoL').textContent  = L.animRunInfo;
                animSegsStart();
            } else if (state === 'ok') {
                w.className = 'zb ss';
                document.getElementById('scLbl').textContent    = '';
                document.getElementById('scStatus').textContent = L.animOkStatus;
                document.getElementById('scInfoL').textContent  = '';
                animSegsStop(true);
            } else if (state === 'err') {
                w.className = 'zb ff';
                document.getElementById('scLbl').textContent    = L.animErrLbl;
                document.getElementById('scStatus').textContent = L.animErrStatus;
                document.getElementById('scInfoL').textContent  = L.animErrInfo;
                animSegsStop(false);
            } else if (state === 'cache') {
                w.className = 'zb';
                document.getElementById('scLbl').textContent    = L.animCacheLbl;
                document.getElementById('scStatus').textContent = L.animCacheStatus;
                document.getElementById('scInfoL').textContent  = L.animCacheInfo;
                animSegsStart();
            }

        } else if (anim === 'a') {
            // ── Анимация А ────────────────────────────────────────────────
            var wa = document.getElementById('zaAnim');
            if (state === 'run') {
                wa.className = 'za';
                document.getElementById('zaStMain').textContent  = L.zaRunSt;
                document.getElementById('zaSubMain').textContent = L.zaRunSub;
            } else if (state === 'ok') {
                wa.className = 'za ss';
                document.getElementById('zaStMain').textContent  = L.zaOkSt;
                document.getElementById('zaSubMain').textContent = L.zaOkSub;
            } else if (state === 'err') {
                wa.className = 'za ff';
                document.getElementById('zaStMain').textContent  = L.zaErrSt;
                document.getElementById('zaSubMain').textContent = L.zaErrSub;
            } else if (state === 'cache') {
                wa.className = 'za';
                document.getElementById('zaStMain').textContent  = L.zaCacheSt;
                document.getElementById('zaSubMain').textContent = L.zaCacheSub;
            }

        } else if (anim === 'c') {
            // ── Анимация В ────────────────────────────────────────────────
            var wc = document.getElementById('zcAnim');
            if (state === 'run') {
                wc.className = 'zc';
                document.getElementById('zcStMain').textContent  = L.zcRunSt;
                document.getElementById('zcSubMain').textContent = L.zcRunSub;
                hexAnimStart();
            } else if (state === 'ok') {
                wc.className = 'zc ss';
                document.getElementById('zcStMain').textContent  = L.zcOkSt;
                document.getElementById('zcSubMain').textContent = L.zcOkSub;
                hexAnimStop(true);
            } else if (state === 'err') {
                wc.className = 'zc ff';
                document.getElementById('zcStMain').textContent  = L.zcErrSt;
                document.getElementById('zcSubMain').textContent = L.zcErrSub;
                hexAnimStop(false);
            } else if (state === 'cache') {
                wc.className = 'zc';
                document.getElementById('zcStMain').textContent  = L.zcCacheSt;
                document.getElementById('zcSubMain').textContent = L.zcCacheSub;
                hexAnimStart();
            }
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  Утилиты лога
    // ════════════════════════════════════════════════════════════════════════
    var lastMsg = "";
    var exploitLaunched = false;

    function switchToLog() {
        document.getElementById('phase-cache').style.display = 'none';
        document.getElementById('log-container').style.display = 'flex';
        document.getElementById('log-container').style.flexDirection = 'column';
    }
    function appendLog(msg, cls) {
        if (!msg || !msg.trim()) return;
        if (msg === lastMsg) return;
        lastMsg = msg;
        var output = document.getElementById('log-output');
        var container = document.getElementById('log-container');
        var line = document.createElement('div');
        line.className = 'log-line' + (cls ? ' ' + cls : '');
        line.innerHTML = msg;
        output.appendChild(line);
        container.scrollTop = container.scrollHeight;
    }

    // ════════════════════════════════════════════════════════════════════════
    //  Запуск эксплойта
    // ════════════════════════════════════════════════════════════════════════
    function launchExploit() {
        if (exploitLaunched) return;
        exploitLaunched = true;
        switchToLog();

        var isPS4 = _isPS4;
        var fwVersion = _fwGlobal || "Unknown";
        var fwNum = parseFloat(fwVersion);
        var L = s();

        function addFrame(src, msgType) {
            appendLog(L.launchFW + fwVersion + "...", "info");
            setAnimState('run', fwVersion);
            var fr = document.createElement('iframe');
            fr.src = src;
            fr.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";
            document.body.appendChild(fr);
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === msgType) {
                    var msg = e.data.msg || '';
                    var cls = e.data.cls || '';
                    appendLog(msg, cls);
                    if (e.data.final) {
                        if (/ALL DONE|\bDONE\b|Kernel exploit succeeded|PSFree.*exploit.*AIO|AIO fixes applied|GoldHEN.*Loaded|Already [Jj]ailbroken|GoldHEN is Already Loaded/i.test(msg)) {
                            setAnimState('ok');
                        } else {
                            setAnimState('err');
                        }
                    }
                }
            });
        }

        if (!isPS4) {
            appendLog(L.noPS4, "error");
        } else if (fwNum >= 5.05 && fwNum <= 5.07) {
            addFrame("ran/g2allpro/index.html", "statusG2");
        } else if (fwNum >= 6.00 && fwNum < 6.72) {
            addFrame("ran/psfree/index.html", "statusPSFree");
        } else if (fwNum === 6.72) {
            addFrame("ran/672/index.html", "status672");
        } else if (fwNum >= 7.00 && fwNum <= 9.60) {
            addFrame("ran/psfree/index.html", "statusPSFree");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            addFrame("ran/g2allpro/index.html", "statusG2");
        } else if (fwNum > 11.02 && fwNum <= 13.00) {
            addFrame("ran/slopkit/index.html", "status_slopkit");
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            addFrame("ran/1352/jb.html?log=1", "status1352");
        } else {
            appendLog(L.unsupported + fwVersion, "error");
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  Определение прошивки
    // ════════════════════════════════════════════════════════════════════════
    var _uaFull   = navigator.userAgent;
    var _uaMatch  = _uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var _isPS4    = _uaMatch !== null;
    var _fwGlobal = _isPS4 ? _uaMatch[1] : null;

    // Показать версию прошивки под статусом каждой анимации
    (function() {
        var txt = _fwGlobal ? 'FW ' + _fwGlobal : '';
        ['fwTagA','fwTagB','fwTagC'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.textContent = txt;
        });
    })();

    // ════════════════════════════════════════════════════════════════════════
    //  Toast-система
    // ════════════════════════════════════════════════════════════════════════
    var _toastTimer = null;
    function showToast(text, type) {
        var container = document.getElementById('toast-container');
        if (!container) return;
        if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
        // Удалить старый
        var old = container.querySelector('.toast');
        if (old) container.removeChild(old);

        var t = document.createElement('div');
        t.className = 'toast ' + (type === 'warn' ? 'toast-warn' : 'toast-ok');
        t.textContent = text;
        container.appendChild(t);
        // Показать с задержкой (для анимации)
        setTimeout(function() { t.classList.add('show'); }, 20);
        _toastTimer = setTimeout(function() {
            t.classList.remove('show');
            setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
        }, type === 'warn' ? 3500 : 2000);
    }

    // ════════════════════════════════════════════════════════════════════════
    //  НАСТРОЙКИ — навигация и логика
    // ════════════════════════════════════════════════════════════════════════
    function openSettings() {
        // Скопировать текущие в tmp
        _tmpLang = _curLang;
        _tmpAnim = _curAnim;

        // Обновить строки настроек
        applyLangToSettings(_tmpLang);
        markLangCard(_tmpLang);
        markAnimCard(_tmpAnim);
        updatePreview(_tmpAnim);

        document.getElementById('main-view').style.display = 'none';
        // Остановить CSS-анимации main-view чтобы снизить потребление памяти
        document.getElementById('main-view').style.visibility = 'hidden';

        var sv = document.getElementById('settings-view');
        sv.style.display = 'block';
        // fix31: принудительный repaint — PS4 WebKit не перерисовывает
        // элементы автоматически при смене display:none→block
        sv.style.webkitTransform = 'translateZ(0)';
        var _forceRepaint = sv.offsetHeight; // чтение layout = flush
        setTimeout(function() {
            sv.style.webkitTransform = '';
            // Фокус на первую карточку языка (tabindex=1)
            var first = document.getElementById('lang-ru');
            if (first) first.focus();
        }, 50);
    }

    function goBack() {
        document.getElementById('settings-view').style.display = 'none';
        var mv = document.getElementById('main-view');
        mv.style.display = 'block';
        mv.style.visibility = '';
        // fix31: repaint при возврате
        mv.style.webkitTransform = 'translateZ(0)';
        var _forceRepaint = mv.offsetHeight;
        setTimeout(function() { mv.style.webkitTransform = ''; }, 50);
    }

    function applySettings() {
        var prevAnim = _curAnim;
        // Сохранить в localStorage
        try {
            localStorage.setItem('lang', _tmpLang);
            localStorage.setItem('anim', _tmpAnim);
        } catch(e) {}
        _curLang = _tmpLang;
        _curAnim = _tmpAnim;

        // Обновить UI главной страницы (язык + анимация)
        applyLangToMain(prevAnim);

        // Toast
        showToast(s().toastApplied, 'ok');

        // Вернуться
        setTimeout(function() {
            document.getElementById('settings-view').style.display = 'none';
            var mv = document.getElementById('main-view');
            mv.style.display = 'block';
            mv.style.visibility = '';
            mv.style.webkitTransform = 'translateZ(0)';
            var _r = mv.offsetHeight;
            setTimeout(function() { mv.style.webkitTransform = ''; }, 50);
        }, 700);
    }

    var _resetPending = false;
    var _resetTimer = null;
    function resetSettings() {
        if (!_resetPending) {
            _resetPending = true;
            showToast(s().toastResetConfirm, 'warn');
            _resetTimer = setTimeout(function() { _resetPending = false; }, 3500);
            return;
        }
        // Подтверждён — сбрасываем
        clearTimeout(_resetTimer);
        _resetPending = false;
        try {
            localStorage.removeItem('lang');
            localStorage.removeItem('anim');
        } catch(e) {}
        _curLang = 'ru'; _curAnim = 'b';
        _tmpLang = 'ru'; _tmpAnim = 'b';
        applyLangToSettings('ru');
        markLangCard('ru');
        markAnimCard('b');
        showToast(STR.ru.toastReset, 'ok');
    }

    // Enter / пробел / крестик (коды 13, 32, 88) — активация карточки с клавиатуры/пульта
    function svCardKey(e, group, val) {
        var k = e.keyCode || e.which;
        if (k === 13 || k === 32 || k === 88) {
            e.preventDefault();
            if (group === 'lang') selectLang(val);
            else selectAnim(val);
        }
    }

    function selectLang(lang) {
        _tmpLang = lang;
        markLangCard(lang);
        applyLangToSettings(lang);
    }

    function selectAnim(anim) {
        _tmpAnim = anim;
        markAnimCard(anim);
        updatePreview(anim);
    }

    function updatePreview(anim) {
        var pa = document.getElementById('pv-a');
        var pb = document.getElementById('pv-b');
        var pc = document.getElementById('pv-c');
        if (!pa) return;
        pa.className = 'pv-a' + (anim === 'a' ? ' active' : '');
        pb.className = 'pv-b' + (anim === 'b' ? ' active' : '');
        pc.className = 'pv-c' + (anim === 'c' ? ' active' : '');
        // Заполнить гекс-сетку превью при первом показе
        var grid = document.getElementById('pv-c-grid');
        if (anim === 'c' && grid && grid.children.length === 0) {
            for (var i = 0; i < 32; i++) {
                var h = document.createElement('div');
                h.className = 'pv-c-hex';
                grid.appendChild(h);
            }
        }
    }

    function markLangCard(lang) {
        document.getElementById('lang-ru').className = 'sv-lang-card' + (lang === 'ru' ? ' selected' : '');
        document.getElementById('lang-en').className = 'sv-lang-card' + (lang === 'en' ? ' selected' : '');
    }

    function markAnimCard(anim) {
        document.getElementById('anim-a').className = 'sv-anim-card' + (anim === 'a' ? ' selected' : '');
        document.getElementById('anim-b').className = 'sv-anim-card' + (anim === 'b' ? ' selected' : '');
        document.getElementById('anim-c').className = 'sv-anim-card' + (anim === 'c' ? ' selected' : '');
    }

    // Применить строки к вид настроек (по временному языку)
    function applyLangToSettings(lang) {
        var L = STR[lang];
        document.getElementById('sv-title').textContent     = L.svTitle;
        document.getElementById('sv-lang-label').textContent = L.svLangLabel;
        document.getElementById('sv-anim-label').textContent = L.svAnimLabel;
        document.getElementById('sv-back-btn').textContent   = L.backBtn;
        document.getElementById('sv-apply-btn').textContent  = L.applyBtn;
        // Подписи анимаций — многострочные, innerHTML с <br>
        document.getElementById('anim-a-label').innerHTML = L.animALabel.replace('\n', '<br>');
        document.getElementById('anim-b-label').innerHTML = L.animBLabel.replace('\n', '<br>');
        document.getElementById('anim-c-label').innerHTML = L.animCLabel.replace('\n', '<br>');
    }

    // Применить строки и анимацию к главному виду (после apply)
    function applyLangToMain(prevAnim) {
        // Футер
        var fc = document.getElementById('footer-credits');
        if (fc) fc.innerHTML = s().credits;

        // Если анимация не изменилась — только обновляем тексты, не трогая таймеры
        if (prevAnim === _curAnim) {
            refreshAnimLabels(_curAnim, _lastAnimState, _lastAnimFw);
            return;
        }

        // Анимация изменилась — остановить старую, переключить блок, запустить новую
        animSegsStop(_lastAnimState === 'ok');
        hexAnimStop(_lastAnimState === 'ok');

        showAnimBlock(_curAnim);

        // Применить CSS-классы состояния и тексты к новому блоку
        var okCls  = _lastAnimState === 'ok'  ? ' ss' : '';
        var errCls = _lastAnimState === 'err' ? ' ff' : '';
        var stateCls = okCls || errCls;

        if (_curAnim === 'b') {
            document.getElementById('zbAnim').className = 'zb' + stateCls;
            refreshAnimLabels('b', _lastAnimState, _lastAnimFw);
            if (_lastAnimState === 'run' || _lastAnimState === 'cache') animSegsStart();
        } else if (_curAnim === 'a') {
            document.getElementById('zaAnim').className = 'za' + stateCls;
            refreshAnimLabels('a', _lastAnimState, _lastAnimFw);
        } else if (_curAnim === 'c') {
            document.getElementById('zcAnim').className = 'zc' + stateCls;
            refreshAnimLabels('c', _lastAnimState, _lastAnimFw);
            if (_lastAnimState === 'run' || _lastAnimState === 'cache') hexAnimStart();
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    //  Инициализация
    // ════════════════════════════════════════════════════════════════════════
    (function init() {
        // Показать нужную анимацию
        showAnimBlock(_curAnim);

        // Запустить idle-анимацию выбранного блока
        if (_curAnim === 'b') {
            animSegsStart();
        } else if (_curAnim === 'c') {
            hexAnimStart();
        }
        // (Для А — rings уже анимированы CSS-анимацией, ничего запускать не нужно)

        // Применить язык к футеру сразу
        applyLangToMain();

        // ── Управление AppCache ────────────────────────────────────────────
        var status_el    = document.getElementById('loading-text');
        var progress_el  = document.getElementById('loading-progress');
        var bar_wrap     = document.getElementById('progress-bar-wrap');
        var bar_fill     = document.getElementById('progress-bar-fill');
        var bar_label    = document.getElementById('progress-bar-label');
        var cache = window.applicationCache;

        function setProgress(pct) {
            bar_wrap.style.display = 'block';
            bar_fill.style.width = pct + '%';
            bar_label.textContent = pct + '%';
            if (pct >= 100) {
                bar_fill.className = 'progress-bar-fill done';
                bar_label.className = 'progress-bar-label complete';
            } else {
                bar_fill.className = 'progress-bar-fill';
                bar_label.className = 'progress-bar-label in-progress';
            }
        }

        if (!cache || cache.status === cache.UNCACHED) {
            status_el.textContent = s().cacheInstalling;
            setAnimState('cache');
        } else if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
            launchExploit();
        } else {
            status_el.textContent = s().cacheLoading;
        }

        cache.addEventListener('progress', function(e) {
            if (e.lengthComputable && e.total > 0) {
                var pct = Math.round(e.loaded / e.total * 100);
                setProgress(pct);
            } else {
                setProgress(Math.min(99, (e.loaded || 1) * 10));
            }
        });

        cache.addEventListener('cached', function() {
            setProgress(100);
            setTimeout(function() {
                switchToLog();
                appendLog(s().cacheOk, "success");
                appendLog(s().cacheOffline, "info");
            }, 1500);
        });

        cache.addEventListener('noupdate', function() {
            launchExploit();
        });

        cache.addEventListener('updateready', function() {
            cache.swapCache();
            launchExploit();
        });

        cache.addEventListener('error', function() {
            if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
                launchExploit();
            } else if (!exploitLaunched) {
                status_el.textContent = s().cacheError;
                bar_wrap.style.display = 'none';
                progress_el.style.display = 'block';
                progress_el.textContent = s().cacheErrText;
                setAnimState('err');
            }
        });
    })();
    </script>
